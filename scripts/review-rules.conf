# review-rules.conf — mechanical review findings, codified. Enforced by scripts/review-lint.sh.
#
# Each block is one rule mined from a real review thread. `source` is the provenance: the PR where
# a human or the AI reviewer caught this, so a rule can always be traced back to the defect that
# earned it. Adding a rule is a one-block append + `scripts/review-lint.sh --update`.
#
# Fields:
#   kind       `regex` (default) or `awk` for rules needing state across lines
#   title      one line, imperative — printed on failure
#   why        what actually breaks (not "best practice")
#   scope      comma-separated `case` patterns; `*` crosses `/` (so `scripts/*` is recursive)
#   exclude    same syntax, applied after scope
#   pattern    ERE passed to `grep -E`               (kind: regex)
#   awk        one-line awk program printing FILENAME":"FNR":"$0 per hit  (kind: awk)
#   ignore     optional ERE; a matching line is not a hit (use for output strings, fixtures)
#   code_only  true = skip full-line comments (trailing comments are NOT stripped; see review-lint.sh)
#   source     provenance
#
# ONLY mechanical rules belong here — patterns that are wrong every time they appear. Findings that
# need intent (doc-vs-code drift, architectural contracts) stay with the reviewer; forcing those
# into a regex produces noise, and a noisy gate trains people to ignore it.

[grep-c-zero-fallback]
title: do not use `grep -c ... || echo 0` as a zero-count fallback
why: `grep -c` PRINTS 0 and exits 1 on no match, so the fallback appends a second 0 and the command substitution yields "0\n0" — arithmetic and comparisons then break
scope: scripts/*, bin/*
code_only: true
pattern: grep -c[^|]*\|\|[[:space:]]*echo[[:space:]]+0
source: coderabbit PR#230 (scripts/lib/kit-brief.sh, "Fix both zero-count fallbacks")

[refs-word-splitting]
title: iterate refs and paths with `while IFS= read -r`, not `for x in $(...)`
why: unquoted command substitution word-splits on the ambient IFS, so refs or worktree paths containing spaces are silently dropped or split — a polluted IFS (including a NUL) breaks it further
scope: scripts/*, bin/*
code_only: true
pattern: for[[:space:]]+[a-zA-Z_][a-zA-Z0-9_]*[[:space:]]+in[[:space:]]+\$\((git|gh)[[:space:]]
source: coderabbit PR#240 (scripts/lib/kit-status.sh, "Worktree paths that contain a space are dropped")

[local-masks-exit-status]
title: split `local x=$(cmd)` into `local x; x=$(cmd)` when the exit status matters
why: `local` is itself a command, so its exit status masks the command substitution's — `set -e` and `|| return` never fire (shellcheck SC2155)
scope: scripts/*, bin/*
code_only: true
pattern: ^[[:space:]]*local[[:space:]]+[a-zA-Z_][a-zA-Z0-9_]*=\$\(
source: coderabbit PR#240 / SC2155

[fence-missing-language]
title: give every fenced code block a language identifier
why: a bare ``` fence renders unhighlighted and breaks docs-site syntax highlighting and copy buttons (markdownlint MD040)
kind: awk
scope: *.md, *.mdx
exclude: docs-site/node_modules/*, CHANGELOG.md, .github/*
awk: FNR==1{inb=0;fence=""} match($0,/^[ \t]*(`{3,}|~{3,})/){m=substr($0,RSTART,RLENGTH);sub(/^[ \t]+/,"",m);rest=substr($0,RSTART+RLENGTH);sub(/^[ \t]+/,"",rest);sub(/[ \t]+$/,"",rest);if(!inb){inb=1;fence=m;if(rest=="")print FILENAME":"FNR":"$0}else if(substr(m,1,1)==substr(fence,1,1)&&length(m)>=length(fence)&&rest==""){inb=0;fence=""}}
note: tracks the OPENING fence's char and length. A parity counter (n%2) breaks on a 4-backtick outer fence - the normal way to show a fenced block inside a fenced block: it counts the ```` line but never reports it, leaving n odd so every later CLOSING fence is reported as a bare opener. ~~~ fences were invisible to it entirely.
source: coderabbit PR#276 (templates/rules/naming-and-ids.md, "Add language identifiers to the fenced code blocks")
