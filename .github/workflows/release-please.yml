name: release-please

# Automated release pipeline (replaces the old manual release.yml).
#
# On every push to main, release-please maintains ONE open "Release PR" that:
#   • bumps all four version surfaces — package.json (release-type: node),
#     docs-site/package.json, .claude-plugin/plugin.json (extra-files),
#     cckit.config.json (extra-files, .kitVersion) — plus Formula/cckit.rb, and
#   • regenerates CHANGELOG.md from the Conventional Commits since the last tag.
# NOTHING SHIPS until you merge that Release PR. Merging it creates the vX.Y.Z tag and the
# GitHub Release, which then triggers the publish job below.
#
# The version number itself comes from the commits (feat -> minor, fix/perf/refactor/revert ->
# patch, feat!/BREAKING CHANGE -> major) — the same rules as scripts/lib/version-bump.sh.
#
# npm publishing uses OIDC "trusted publishing" (GA mid-2025) — NO long-lived token. GitHub Actions
# mints a short-lived OIDC token per run that npm exchanges for publish rights, and the publish is
# automatically signed with provenance. One-time setup on npmjs.com: the @jeiemgi/cckit package ->
# Settings -> Trusted Publishing -> add this repo + workflow (.github/workflows/release-please.yml).
# Requires npm >= 11.5.1 (setup-node's bundled npm is older, so the job upgrades it first).
#
# The Homebrew channel is gated on secrets. With NEITHER configured the channel is skipped and the
# release still succeeds. With one configured it is no longer optional: the bump runs, a verification
# step reads the tap back and the job FAILS if it does not serve the released version. That is
# deliberate (#287) — an empty or expired credential still clones a public tap fine and only fails on
# push, so four releases reported success while `brew` stayed on 0.5.0.
#   Homebrew tap auth (either — the GitHub App is preferred, the PAT is the fallback):
#     HOMEBREW_APP_ID          + HOMEBREW_APP_PRIVATE_KEY — a GitHub App (Contents: write) installed on
#                              homebrew-cckit; the workflow mints a short-lived, tap-scoped token per run.
#     HOMEBREW_TAP_TOKEN       legacy PAT with push access to jeiemgi/homebrew-cckit (contents:write).
on:
  push:
    branches: [main]

permissions:
  contents: write        # create the release branch/commit, the tag, and the GitHub Release
  pull-requests: write   # open and update the Release PR

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # Pin the release line to main. Without this, release-please defaults target-branch to
          # the repo DEFAULT branch (develop in our gitflow) and would read the wrong history —
          # so releases are cut from main even though development integrates on develop.
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only on the push that MERGES the Release PR (release_created == true), i.e. right after
  # the tag + GitHub Release are created. Same channels the old release.yml published to.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read      # check out the tagged commit
      id-token: write     # mint the OIDC token npm exchanges for publish rights (trusted publishing)
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_APP_ID: ${{ secrets.HOMEBREW_APP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}   # publish exactly what was tagged
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; setup-node's bundled npm is older. Pin the major:
      # `npm@latest` moved to 12.x, which requires node >= 22 and so EBADENGINE-fails on the node 20
      # this job runs. npm 11 satisfies the trusted-publishing floor and runs on node 20.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      # No token: npm detects the Actions OIDC (id-token: write above) and exchanges it for a
      # short-lived publish credential, signing the tarball with provenance automatically. Requires
      # the trusted publisher to be configured once on npmjs.com (see the header comment).
      - name: Publish to npm (OIDC trusted publishing)
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          # Idempotent, so a partially-failed release can be RE-DRIVEN. npm refuses to republish a
          # version ("You cannot publish over the previously published versions"), and this step runs
          # before the Homebrew steps — so once npm had 0.7.0, every re-run died here and the tap
          # bump was unreachable. That is why the tap could never catch up on its own (#287): the
          # release was not recoverable, only re-releasable.
          if [ -n "${VERSION:-}" ] && npm view "@jeiemgi/cckit@$VERSION" version >/dev/null 2>&1; then
            echo "::notice title=npm::@jeiemgi/cckit@$VERSION is already published — skipping publish so the remaining channels can run."
            echo "### :package: npm already at \`$VERSION\` — publish skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npm publish --access public

      # Preferred tap auth: mint a short-lived, tap-scoped token from the cckit-release GitHub App
      # (set HOMEBREW_APP_ID + HOMEBREW_APP_PRIVATE_KEY secrets, install the app on homebrew-cckit
      # with Contents: write). Skipped until the app secrets exist — then the step below falls back
      # to the legacy HOMEBREW_TAP_TOKEN PAT.
      - name: Mint a tap token from the GitHub App
        id: tap_app_token
        if: ${{ env.HOMEBREW_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-cckit

      - name: Bump the Homebrew tap
        # Run if either auth path is available: the GitHub App (preferred) or the legacy PAT.
        if: ${{ env.HOMEBREW_APP_ID != '' || env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          # App token when present, else the PAT — the first non-empty wins.
          GH_TOKEN: ${{ steps.tap_app_token.outputs.token || secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          # An EMPTY token is not "no auth path" — it is a broken one. The clone below succeeds
          # anonymously against a public tap and only the push fails, which is how #287 hid: four
          # releases in a row reported success because npm and the tag had already landed. Refuse
          # up front instead, so the failure names its own cause.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=Homebrew tap::HOMEBREW_APP_ID or HOMEBREW_TAP_TOKEN is set but resolved to an EMPTY token — no credential to push with. Set HOMEBREW_APP_ID + HOMEBREW_APP_PRIVATE_KEY (App with Contents: write, installed on homebrew-cckit), or refresh HOMEBREW_TAP_TOKEN."
            exit 1
          fi
          url="https://github.com/${{ github.repository }}/archive/refs/tags/v$v.tar.gz"
          # The tag tarball is generated on demand right after the tag is created — retry until it's ready.
          sha="$(curl -fsSL --retry 6 --retry-delay 5 "$url" | sha256sum | cut -d' ' -f1)"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/jeiemgi/homebrew-cckit" tap
          cd tap
          # Update url, sha256 AND the explicit `version` line — a stale version line makes brew
          # resolve the wrong version even when the url/sha are current.
          perl -0pi -e "s{url \"[^\"]*\"}{url \"$url\"}; s{sha256 \"[^\"]*\"}{sha256 \"$sha\"}; s{version \"[^\"]*\"}{version \"$v\"}" Formula/cckit.rb
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "cckit $v"
          git push

      # Assert the tap actually serves the released version, reading it back from the remote rather
      # than trusting the push. This catches every failure mode, not just a bad credential: a perl
      # no-op, the wrong repository, a formula whose `version` line drifted from its url. It runs
      # even when the bump step failed (`always()`), because a skipped verification is exactly how a
      # stale tap survives a release.
      - name: Verify the tap serves this version
        if: ${{ always() && (env.HOMEBREW_APP_ID != '' || env.HOMEBREW_TAP_TOKEN != '') }}
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          v="$VERSION"
          raw="https://raw.githubusercontent.com/jeiemgi/homebrew-cckit/main/Formula/cckit.rb"
          # Retry: the push and raw.githubusercontent's cache are not instantaneous.
          for _ in 1 2 3 4 5 6; do
            f="$(curl -fsSL "$raw" || true)"
            printf '%s' "$f" | grep -q "version \"$v\"" && break
            sleep 10
          done
          got_v="$(printf '%s' "$f" | sed -nE 's/^[[:space:]]*version "([^"]*)".*/\1/p' | head -1)"
          got_u="$(printf '%s' "$f" | sed -nE 's|^[[:space:]]*url "([^"]*)".*|\1|p' | head -1)"
          got_s="$(printf '%s' "$f" | sed -nE 's/^[[:space:]]*sha256 "([^"]*)".*/\1/p' | head -1)"
          # The exact URL and the real digest, not a pattern: a formula can carry the right version
          # with an archive from another repo (brew installs the wrong code), or the right URL with a
          # stale sha256 (brew refuses to install). Both pass a suffix check.
          want_u="https://github.com/${{ github.repository }}/archive/refs/tags/v$v.tar.gz"
          want_s="$(curl -fsSL --retry 6 --retry-delay 5 "$want_u" | sha256sum | cut -d' ' -f1)"
          if [ "$got_v" != "$v" ]; then
            echo "::error title=Homebrew tap stale::the tap serves version '$got_v', expected '$v' — brew users will not get this release. See issue #287."
            {
              echo "### :beer: Homebrew tap is STALE"
              echo "Released **$v**, tap serves **${got_v:-unknown}**. \`brew\` users stay on the old version."
              echo "Fix the tap credential, then re-run this job or bump \`Formula/cckit.rb\` by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$got_u" != "$want_u" ]; then
            echo "::error title=Homebrew tap url::formula url is '$got_u', expected '$want_u' — brew would download an archive that is not this release."
            echo "### :beer: Homebrew tap url MISMATCH" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$got_s" != "$want_s" ]; then
            echo "::error title=Homebrew tap sha256::formula sha256 is '$got_s', but v$v.tar.gz hashes to '$want_s' — brew would refuse the install."
            echo "### :beer: Homebrew tap sha256 MISMATCH — \`brew install\` would fail" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "tap serves $got_v · $got_u · sha256 ok"
          echo "### :beer: Homebrew tap OK — \`$got_v\`, url and sha256 verified" >> "$GITHUB_STEP_SUMMARY"
